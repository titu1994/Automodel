# Qwen3-1.7B SFT on OpenCode Good Behaviour data at 32K sequence length.
#
# Data: JSONL with OpenAI-style ``messages`` (and optional ``tools``) per line.
# Train and validation both point at the same mini file below for smoke runs; set
# ``validation_dataset.path_or_dataset_id`` to a held-out JSONL when you have one.
#
# Run training:
#   PYTHONPATH=.:$PYTHONPATH  python -m nemo_automodel.cli.app experiments/qwen3_opencode/trial/qwen3_1p7b_opencode_32k.yaml --nproc-per-node 1
#
# ChatDataset requires a tokenizer chat template (Qwen3 provides one).

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 16
  local_batch_size: 2
  ckpt_every_steps: 256
  val_every_steps: 16
  num_epochs: 10
  max_steps: 10000

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-1.7B

compile:
  enabled: false
  mode: "default"
  fullgraph: false
  dynamic: false
  backend: null

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  ep_size: 1

  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.te_parallel_ce.TEParallelCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /data/OpenCode-Good-Behaviour/mini_dataset.jsonl
  seq_length: 32768
  padding: do_not_pad
  truncation: true
  split: train   # any will do

packed_sequence:
  packed_sequence_size: 32768
  drop_long_samples: true

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: /data/OpenCode-Good-Behaviour/mini_dataset.jsonl
  seq_length: 32768
  padding: do_not_pad
  truncation: true
  split: validation

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0
  fused: True

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

checkpoint:
  enabled: true
  checkpoint_dir: /checkpoints/opencode-good-behaviour/qwen3-1.7b-opencode-32k
  model_save_format: safetensors
  save_consolidated: false
  restore_from: LATEST

wandb:
  project: opencode-good-behaviour
  name: qwen3-1.7b-opencode-32k
  mode: online
  dir: ./wandb

